<body class="bg-gray-100 font-sans min-h-screen p-3 md:p-6 pb-20">

        ];
        let wrongStats = {};
        let lastRoundWrongSet = new Set();
        let currentQuestion = null;
        let batchQueue = [];
        let selectedQuestions = new Set();
        let isPracticeFinished = false;
        function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        window.onload = function() {
            document.getElementById("q-count").textContent = questionBank.length;
            generateGrid();
        };
        function generateGrid() {
            const grid = document.getElementById("q-grid");
            grid.innerHTML = "";
            for(let i = 1; i <= questionBank.length; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                btn.className = "q-btn bg-gray-100 text-gray-700 font-bold text-lg md:text-xl py-3 rounded-lg border border-gray-300 active:bg-gray-300";
                btn.onclick = function() { toggleQuestion(i, btn); };
                grid.appendChild(btn);
            }
        }
        function toggleQuestion(num, btnElement) {
            if (selectedQuestions.has(num)) {
                selectedQuestions.delete(num);
                btnElement.classList.remove("selected");
            } else {
                selectedQuestions.add(num);
                btnElement.classList.add("selected");
            }
            updateStartButton();
        }
        function toggleSelectAll() {
            const btns = document.getElementById("q-grid").children;
            const isAllSelected = selectedQuestions.size === questionBank.length;
            for(let i = 1; i <= questionBank.length; i++) {
                const btn = btns[i-1];
                if (isAllSelected) {
                    selectedQuestions.delete(i);
                    btn.classList.remove("selected");
                } else {
                    selectedQuestions.add(i);
                    btn.classList.add("selected");
                }
            }
            updateStartButton();
        }
        function updateStartButton() {
            const startBtn = document.getElementById("batch-start-btn");
            const selectAllBtn = document.getElementById("select-all-btn");
            if (selectedQuestions.size === questionBank.length) { selectAllBtn.textContent = "取消全選"; } else { selectAllBtn.textContent = "全選"; }
            if (selectedQuestions.size > 0) {
                startBtn.classList.remove("hidden");
                document.getElementById("img-status").textContent = "已選 " + selectedQuestions.size + " 題";
            } else {
                startBtn.classList.add("hidden");
                document.getElementById("img-status").textContent = "";
            }
        }
        function startBatchPractice() {
            if (selectedQuestions.size === 0) return;
            batchQueue = Array.from(selectedQuestions).sort(function(a, b) { return a - b; });
            resetWrongRecords();
            document.getElementById("batch-progress").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadQuestion(batchQueue[0]);
        }
        function retryCurrentWrongQuestions() {
            if (lastRoundWrongSet.size === 0) return;
            batchQueue = Array.from(lastRoundWrongSet).sort(function(a, b) { return a - b; });
            resetWrongRecords();
            document.getElementById("batch-progress").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadQuestion(batchQueue[0]);
        }
        function resetWrongRecords() {
            lastRoundWrongSet.clear();
            wrongStats = {};
            isPracticeFinished = false;
            updateStatsTable();
        }
        function loadQuestion(qId) {
            currentQuestion = questionBank[qId - 1];
            document.getElementById("batch-progress").textContent = "剩 " + batchQueue.length + " 題";
            document.getElementById("quiz-title").textContent = "第 " + currentQuestion.id + " 題";
            document.getElementById("quiz-content").innerHTML = currentQuestion.html || esc(currentQuestion.text);
            document.getElementById("feedback").textContent = "";
            document.getElementById("feedback").className = "mt-4 text-center text-xl md:text-2xl font-bold h-10";
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            let options = (currentQuestion.answer === "○" || currentQuestion.answer === "╳" || currentQuestion.text.includes("是非題")) ? ["○", "╳"] : ["①", "②", "③", "④"];
            options.forEach(function(opt) {
                const btn = document.createElement("button");
                btn.textContent = opt;
                btn.className = "btn-option bg-yellow-100 hover:bg-yellow-300 text-yellow-900 text-2xl md:text-3xl font-bold py-4 md:py-6 rounded-xl border-2 border-yellow-400 active:bg-yellow-400 shadow-sm";
                btn.onclick = function() { checkAnswer(opt); };
                optionsContainer.appendChild(btn);
            });
            document.getElementById("section-menu").classList.add("hidden-section");
            document.getElementById("section-quiz").classList.remove("hidden-section");
        }
        function checkAnswer(selectedOpt) {
            const feedbackBox = document.getElementById("feedback");
            if (selectedOpt === currentQuestion.answer) {
                feedbackBox.textContent = "🎉 答對了！";
                feedbackBox.className = "mt-4 text-center text-xl md:text-2xl font-bold h-10 text-green-600";
                setTimeout(function() {
                    batchQueue.shift();
                    if (batchQueue.length > 0) { loadQuestion(batchQueue[0]); } else { finishPracticeRound(); }
                }, 1000);
            } else {
                feedbackBox.textContent = "❌ 答錯囉，再試一次！";
                feedbackBox.className = "mt-4 text-center text-xl md:text-2xl font-bold h-10 text-red-500 animate-pulse";
                lastRoundWrongSet.add(currentQuestion.id);
                wrongStats[currentQuestion.id] = (wrongStats[currentQuestion.id] || 0) + 1;
                updateStatsTable();
            }
        }
        function finishPracticeRound() {
            isPracticeFinished = true;
            backToMenu();
            updateStatsTable();
            if (lastRoundWrongSet.size === 0) {
                const randomMsg = encouragementList[Math.floor(Math.random() * encouragementList.length)];
                alert("💯 恭喜獲得 100 分！\n\n" + randomMsg);
            } else {
                alert("👍 本輪練習結束！下方已為你整理出錯題列表，點擊【重做下方錯題】按鈕即可再次挑戰！");
            }
            selectedQuestions.clear();
            generateGrid();
            document.getElementById("batch-start-btn").classList.add("hidden");
            document.getElementById("img-status").textContent = "";
            updateStartButton();
        }
        function backToMenu() {
            document.getElementById("section-quiz").classList.add("hidden-section");
            document.getElementById("section-menu").classList.remove("hidden-section");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        function updateStatsTable() {
            const tbody = document.getElementById("stats-body");
            const retryBtn = document.getElementById("retry-wrong-btn");
            const wrongCountTag = document.getElementById("wrong-count-tag");
            tbody.innerHTML = "";
            let wrongCount = Object.keys(wrongStats).length;
            if (wrongCount > 0) {
                if (isPracticeFinished) { retryBtn.classList.remove("hidden"); wrongCountTag.textContent = wrongCount; } else { retryBtn.classList.add("hidden"); }
                Object.keys(wrongStats).forEach(function(id) {
                    const qText = esc(questionBank[id-1].text.substring(0, 15)) + (questionBank[id-1].hasImg ? " 🖼" : "") + "...";
                    const tr = document.createElement("tr");
                    tr.className = "border-b bg-red-50";
                    tr.innerHTML = '<td class="py-2 px-3 font-bold text-gray-700 text-center">' + id + '</td>' +
                                    '<td class="py-2 px-3 text-gray-800">' + qText + '</td>' +
                                    '<td class="py-2 px-3 text-center font-bold text-red-600">' + wrongStats[id] + '</td>';
                    tbody.appendChild(tr);
                });
            } else {
                retryBtn.classList.add("hidden");
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">目前沒有錯題記錄</td></tr>';
            }
        }
    </script>
</body>
</html>
