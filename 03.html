<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>國小四年級 上學期 自然科 第一次評量 試題卷 - 錯題重答系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hidden-section { display: none; }
        .q-btn { transition: all 0.1s; touch-action: manipulation; }
        .q-btn.selected { background-color: #ef4444; color: white; border-color: #dc2626; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.5); transform: scale(1.05); }
        .btn-option { touch-action: manipulation; }
        .btn-option:active { transform: scale(0.95); }
        #quiz-content img { display: block; margin: 12px auto; max-width: 100%; height: auto; }
        #quiz-content .opts { margin-top: 8px; }
        #quiz-content .opt { display: inline-block; margin: 4px 22px 4px 0; }
        #quiz-content .ctx { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; font-size: 0.95em; color: #374151; }
        #quiz-content .ctxline { margin: 14px 0; border: 0; border-top: 2px dashed #d1d5db; }
        .grid-head { grid-column: 1 / -1; font-weight: 700; color: #6b21a8; border-bottom: 2px solid #e9d5ff; padding-bottom: 2px; margin-top: 6px; }
        .grid-head:first-child { margin-top: 0; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 md:p-6 pb-20">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-4 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-green-600 mb-2">🎓 錯題重答練習系統</h1>
        <h2 class="text-xl md:text-2xl font-bold text-center text-blue-800 mb-6 bg-blue-50 py-3 px-4 rounded-xl border border-blue-200">📄 單元主題：國小四年級 上學期 自然科 第一次評量 試題卷</h2>

        <div id="section-menu" class="mb-8">

            <div class="bg-purple-50 border-2 border-purple-300 rounded-lg p-4 md:p-6 mb-8 shadow-sm">

                        <div class="flex items-center gap-3">
                            <span id="img-status" class="text-sm font-bold text-purple-600"></span>
                            <button id="select-all-btn" onclick="toggleSelectAll()" class="bg-purple-200 hover:bg-purple-300 text-purple-800 font-bold py-1.5 px-4 rounded-lg shadow-sm transition-colors text-sm md:text-base border border-purple-400">
                                全選
                            </button>
                        </div>
                    </div>
                    <div id="q-grid" class="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 md:gap-3 bg-white p-4 md:p-6 rounded-xl border border-purple-200 h-auto max-h-96 overflow-y-auto shadow-inner">
                    </div>
                    <button id="batch-start-btn" onclick="startBatchPractice()" class="mt-6 w-full bg-purple-600 text-white font-bold py-3 md:py-4 px-6 rounded-xl hover:bg-purple-700 shadow animate-pulse hidden text-lg">
                        🚀 確認無誤，開始重答
                    </button>

            </div>
        </div>

            <div class="flex justify-between items-center mb-4">
                <button onclick="backToMenu()" class="text-gray-500 hover:text-gray-800 font-bold px-3 py-2 border rounded bg-white shadow-sm text-sm md:text-base">← 返回主選單</button>
                <span id="batch-progress" class="font-bold text-white bg-purple-600 px-3 py-1 rounded-full shadow text-sm"></span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4" id="options-container"></div>
            <div id="feedback" class="mt-4 text-center text-xl md:text-2xl font-bold h-10"></div>

                <button id="retry-wrong-btn" onclick="retryCurrentWrongQuestions()" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-5 rounded-lg shadow transition-all animate-bounce">

                    <tbody id="stats-body">
                        <tr><td colspan="3" class="py-4 text-center text-gray-500">目前沒有錯題記錄</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const questionBank = [{"id":1,"label":"1","sec":"選擇題","text":"哪一種曆制會與月相變化的週期互相配合？","type":"mc","n":4,"ls":"c","answer":"3","html":"哪一種曆制會與月相變化的週期互相配合？<div class=\"opts\"><span class=\"opt\">① 國曆<\/span><span class=\"opt\">② 太陽曆<\/span><span class=\"opt\">③ 農曆<\/span><span class=\"opt\">④ 新曆<\/span><\/div>"},{"id":2,"label":"2","sec":"選擇題","text":"小強用拳頭測量月亮高度角，每增加一個拳頭，高度角大約增加幾度？","type":"mc","n":4,"ls":"c","answer":"2","html":"小強用拳頭測量月亮高度角，每增加一個拳頭，高度角大約增加幾度？<div class=\"opts\"><span class=\"opt\">① 5度<\/span><span class=\"opt\">② 10度<\/span><span class=\"opt\">③ 60度<\/span><span class=\"opt\">④ 90度<\/span><\/div>"},{"id":3,"label":"3","sec":"選擇題","text":"指北針可以測量物體的哪一項資訊？","type":"mc","n":4,"ls":"c","answer":"3","html":"指北針可以測量物體的哪一項資訊？<div class=\"opts\"><span class=\"opt\">① 高度角<\/span><span class=\"opt\">② 溼度<\/span><span class=\"opt\">③ 方位<\/span><span class=\"opt\">④ 溫度<\/span><\/div>"},{"id":4,"label":"4","sec":"選擇題","text":"青蛙除了用肺呼吸外，還利用下列哪一個器官輔助呼吸？","type":"mc","n":4,"ls":"c","answer":"4","html":"青蛙除了用肺呼吸外，還利用下列哪一個器官輔助呼吸？<div class=\"opts\"><span class=\"opt\">① 鰓<\/span><span class=\"opt\">② 呼吸管<\/span><span class=\"opt\">③ 尾巴<\/span><span class=\"opt\">④ 溼潤的皮膚<\/span><\/div>"},{"id":5,"label":"5","sec":"選擇題","text":"使用高度角觀測器時，綁住迴紋針的棉線具有什麼用途？","type":"mc","n":4,"ls":"c","answer":"1","html":"使用高度角觀測器時，綁住迴紋針的棉線具有什麼用途？<div class=\"opts\"><span class=\"opt\">① 幫助讀出高度角度數<\/span><span class=\"opt\">② 使眼睛與月亮形成一直線<\/span><span class=\"opt\">③ 增加整體重量會比較好用<\/span><span class=\"opt\">④ 比較美觀<\/span><\/div>"},{"id":6,"label":"6","sec":"選擇題","text":"當光遇到不透明的物體時，會發生什麼現象？","type":"mc","n":4,"ls":"c","answer":"4","html":"當光遇到不透明的物體時，會發生什麼現象？<div class=\"opts\"><span class=\"opt\">① 光直接穿過物體<\/span><span class=\"opt\">② 光穿過物體且變得更亮<\/span><span class=\"opt\">③ 光穿過物體但亮度變暗<\/span><span class=\"opt\">④ 無法穿過物體而產生影子<\/span><\/div>"},{"id":7,"label":"7","sec":"選擇題","text":"關於一天中月亮移動方向的敘述，下列何者正確？","type":"mc","n":4,"ls":"c","answer":"2","html":"關於一天中月亮移動方向的敘述，下列何者正確？<div class=\"opts\"><span class=\"opt\">① 由西邊升起，東邊落下<\/span><span class=\"opt\">② 就像太陽一樣，有東升西落的現象<\/span><span class=\"opt\">③ 由南邊升起，北邊落下<\/span><span class=\"opt\">④ 整晚固定在天空東方不會移動<\/span><\/div>"},{"id":8,"label":"8","sec":"選擇題","text":"下午 2 時 30 分時，若觀測到太陽位於「西南方」，請問此時物體影子的方位會在哪裡？","type":"mc","n":4,"ls":"c","answer":"3","html":"下午 2 時 30 分時，若觀測到太陽位於「西南方」，請問此時物體影子的方位會在哪裡？<div class=\"opts\"><span class=\"opt\">① 西北方<\/span><span class=\"opt\">② 東南方<\/span><span class=\"opt\">③ 東北方<\/span><span class=\"opt\">④ 西南方<\/span><\/div>"},{"id":9,"label":"9","sec":"選擇題","text":"下列哪一個不屬於淡水水域環境？","type":"mc","n":4,"ls":"c","answer":"3","html":"下列哪一個不屬於淡水水域環境？<div class=\"opts\"><span class=\"opt\">① 埤塘<\/span><span class=\"opt\">② 湖泊<\/span><span class=\"opt\">③ 海洋<\/span><span class=\"opt\">④ 河流<\/span><\/div>"},{"id":10,"label":"10","sec":"選擇題","text":"關於紅樹林植物主要生長的水域環境，下列敘述何者正確？","type":"mc","n":4,"ls":"c","answer":"2","html":"關於紅樹林植物主要生長的水域環境，下列敘述何者正確？<div class=\"opts\"><span class=\"opt\">① 高山頂部的冰雪湖泊<\/span><span class=\"opt\">② 河流與海洋的河海口交界處<\/span><span class=\"opt\">③ 陽光照射不到的深海海底<\/span><span class=\"opt\">④ 乾燥無水的沙漠地帶<\/span><\/div>"},{"id":11,"label":"11","sec":"選擇題","text":"哪一種水域環境位於河流與海洋的交接處，且「含鹽量變化大」？","type":"mc","n":4,"ls":"c","answer":"2","html":"哪一種水域環境位於河流與海洋的交接處，且「含鹽量變化大」？<div class=\"opts\"><span class=\"opt\">① 水田<\/span><span class=\"opt\">② 河海口交界水域<\/span><span class=\"opt\">③ 高山湖泊<\/span><span class=\"opt\">④ 埤塘<\/span><\/div>"},{"id":12,"label":"12","sec":"選擇題","text":"下列哪一種動物是利用「腹足」進行爬行的？","type":"mc","n":4,"ls":"c","answer":"1","html":"下列哪一種動物是利用「腹足」進行爬行的？<div class=\"opts\"><span class=\"opt\">① 椎實螺<\/span><span class=\"opt\">② 水黽<\/span><span class=\"opt\">③ 蝦<\/span><span class=\"opt\">④ 鯨鯊<\/span><\/div>"},{"id":13,"label":"13","sec":"選擇題","text":"切開荷花的葉柄或地下莖（蓮藕），會發現裡面有什麼特殊的構造？","type":"mc","n":4,"ls":"c","answer":"2","html":"切開荷花的葉柄或地下莖（蓮藕），會發現裡面有什麼特殊的構造？<div class=\"opts\"><span class=\"opt\">① 滿滿的油脂<\/span><span class=\"opt\">② 中空的通氣組織<\/span><span class=\"opt\">③ 堅硬的骨架<\/span><span class=\"opt\">④ 許多小蟲子<\/span><\/div>"},{"id":14,"label":"14","sec":"選擇題","text":"布袋蓮與大萍能浮在水面上的共同適應特徵是？","type":"mc","n":4,"ls":"c","answer":"2","html":"布袋蓮與大萍能浮在水面上的共同適應特徵是？<div class=\"opts\"><span class=\"opt\">① 葉子都非常厚重<\/span><span class=\"opt\">② 具備儲存空氣的構造或組織<\/span><span class=\"opt\">③ 根都深深扎根在泥土深處<\/span><span class=\"opt\">④ 花朵都非常巨大<\/span><\/div>"},{"id":15,"label":"15","sec":"選擇題","text":"想要精準的表示月亮的位置，應該要測量下列哪兩項？","type":"mc","n":4,"ls":"c","answer":"1","html":"想要精準的表示月亮的位置，應該要測量下列哪兩項？<div class=\"opts\"><span class=\"opt\">① 方位和高度角<\/span><span class=\"opt\">② 方位和高度<\/span><span class=\"opt\">③ 亮度和高度角<\/span><span class=\"opt\">④ 亮度和高度<\/span><\/div>"},{"id":16,"label":"16","sec":"選擇題","text":"觀察水生植物時，通氣組織最主要的功能是什麼？","type":"mc","n":4,"ls":"c","answer":"1","html":"觀察水生植物時，通氣組織最主要的功能是什麼？<div class=\"opts\"><span class=\"opt\">① 輸送與儲存空氣<\/span><span class=\"opt\">② 吸引昆蟲前來採蜜<\/span><span class=\"opt\">③ 增加植物重量以沉入水底<\/span><span class=\"opt\">④ 防禦魚類咬食<\/span><\/div>"},{"id":17,"label":"17","sec":"選擇題","text":"下列關於沉水性植物「水蘊草」的敘述，哪一個是錯誤的？","type":"mc","n":4,"ls":"c","answer":"3","html":"下列關於沉水性植物「水蘊草」的敘述，哪一個是錯誤的？<div class=\"opts\"><span class=\"opt\">① 整株沉在水中生活<\/span><span class=\"opt\">② 葉片極薄<\/span><span class=\"opt\">③ 莖葉堅硬無法彎曲<\/span><span class=\"opt\">④ 莖葉會隨水流擺動<\/span><\/div>"},{"id":18,"label":"18","sec":"選擇題","text":"在進行月亮觀測畫簡圖時，畫下不會移動的「地面參考體」（如大樓或樹木），主要目的是什麼？","type":"mc","n":4,"ls":"c","answer":"2","html":"在進行月亮觀測畫簡圖時，畫下不會移動的「地面參考體」（如大樓或樹木），主要目的是什麼？<div class=\"opts\"><span class=\"opt\">① 增加畫面美觀<\/span><span class=\"opt\">② 幫助比較與確認月亮位置的變化<\/span><span class=\"opt\">③ 讓月亮看起來更亮<\/span><span class=\"opt\">④ 測量氣溫變化<\/span><\/div>"},{"id":19,"label":"19","sec":"選擇題","text":"關於水生動物和呼吸構造的配對，下列哪一項正確？","type":"mc","n":4,"ls":"c","answer":"4","html":"關於水生動物和呼吸構造的配對，下列哪一項正確？<div class=\"opts\"><span class=\"opt\">① 鯨魚：鰓<\/span><span class=\"opt\">② 紅娘華：皮膚<\/span><span class=\"opt\">③ 海豚：鰓<\/span><span class=\"opt\">④ 魚類：鰓<\/span><\/div>"},{"id":20,"label":"20","sec":"選擇題","text":"海洋中的鯨鯊常會誤食塑膠袋，主要原因是把塑膠袋誤認為什麼？","type":"mc","n":4,"ls":"c","answer":"3","html":"海洋中的鯨鯊常會誤食塑膠袋，主要原因是把塑膠袋誤認為什麼？<div class=\"opts\"><span class=\"opt\">① 海水<\/span><span class=\"opt\">② 石頭<\/span><span class=\"opt\">③ 食物<\/span><span class=\"opt\">④ 同伴<\/span><\/div>"},{"id":21,"label":"21","sec":"選擇題","text":"使用指北針測量方位前，要先將指針的箭頭對齊盤面上的哪一個字？","type":"mc","n":4,"ls":"c","answer":"4","html":"使用指北針測量方位前，要先將指針的箭頭對齊盤面上的哪一個字？<div class=\"opts\"><span class=\"opt\">① 東<\/span><span class=\"opt\">② 南<\/span><span class=\"opt\">③ 西<\/span><span class=\"opt\">④ 北<\/span><\/div>"},{"id":22,"label":"22","sec":"選擇題","text":"關於晚上是否能看到月亮的敘述，下列何者正確？","type":"mc","n":4,"ls":"c","answer":"2","html":"關於晚上是否能看到月亮的敘述，下列何者正確？<div class=\"opts\"><span class=\"opt\">① 只要天氣晴朗，每天晚上都一定看得到月亮<\/span><span class=\"opt\">② 農曆初一（朔）附近，即使晴天晚上也看不見月亮<\/span><span class=\"opt\">③ 只有下雨天才能看到月亮<\/span><span class=\"opt\">④ 中秋節當天絕對看不到月亮<\/span><\/div>"},{"id":23,"label":"23","sec":"選擇題","text":"隨意在野外水域放生或棄養外來種動植物，會產生什麼影響？","type":"mc","n":4,"ls":"c","answer":"2","html":"隨意在野外水域放生或棄養外來種動植物，會產生什麼影響？<div class=\"opts\"><span class=\"opt\">① 增加生物多樣性，對生態很好<\/span><span class=\"opt\">② 會破壞原本的生態平衡與威脅本土物種<\/span><span class=\"opt\">③ 完全不會有任何影響<\/span><span class=\"opt\">④ 會讓野外水質立刻變乾淨<\/span><\/div>"},{"id":24,"label":"24","sec":"選擇題","text":"關於水稻的生長環境與植物類型，下列何者正確？","type":"mc","n":4,"ls":"c","answer":"1","html":"關於水稻的生長環境與植物類型，下列何者正確？<div class=\"opts\"><span class=\"opt\">① 水稻生長在水田裡，是挺水性水生植物的一種<\/span><span class=\"opt\">② 水稻是沉水性植物<\/span><span class=\"opt\">③ 水稻是漂浮性植物<\/span><span class=\"opt\">④ 水稻不能生長在水中<\/span><\/div>"},{"id":25,"label":"25","sec":"選擇題","text":"關於水蠆的成長與運動方式，下列何者正確？","type":"mc","n":4,"ls":"c","answer":"2","html":"關於水蠆的成長與運動方式，下列何者正確？<div class=\"opts\"><span class=\"opt\">① 長大後會變成蛙類<\/span><span class=\"opt\">② 長大後會變成蜻蜓<\/span><span class=\"opt\">③ 用鰓呼吸且長大後會變成魚類<\/span><span class=\"opt\">④ 終生都不會改變型態<\/span><\/div>"},{"id":26,"label":"26","sec":"選擇         function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        function qName(q) { return (q.sec ? q.sec + " " : "") + "第 " + q.label + " 題"; }

        window.onload = function() {
            document.getElementById("q-count").textContent = questionBank.length;
            generateGrid();
        };
        function generateGrid() {
            const grid = document.getElementById("q-grid");
            grid.innerHTML = "";
            gridBtns = {};
            let lastSec = null;
            questionBank.forEach(function(q) {
                if (q.sec !== lastSec) {
                    lastSec = q.sec;
                    if (q.sec) {
                        const head = document.createElement("div");
                        head.className = "grid-head";
                        head.textContent = q.sec;
                        grid.appendChild(head);
                    }
                }
                const btn = document.createElement("button");
                btn.textContent = q.label;
                btn.className = "q-btn bg-gray-100 text-gray-700 font-bold text-lg md:text-xl py-3 rounded-lg border border-gray-300 active:bg-gray-300";
                btn.onclick = function() { toggleQuestion(q.id, btn); };
                gridBtns[q.id] = btn;
                grid.appendChild(btn);
            });
        }
        function toggleQuestion(id, btnElement) {
            if (selectedQuestions.has(id)) {
                selectedQuestions.delete(id);
                btnElement.classList.remove("selected");
            } else {
                selectedQuestions.add(id);
                btnElement.classList.add("selected");
            }
            updateStartButton();
        }
        function toggleSelectAll() {
            const isAllSelected = selectedQuestions.size === questionBank.length;
            questionBank.forEach(function(q) {
                if (isAllSelected) { selectedQuestions.delete(q.id); gridBtns[q.id].classList.remove("selected"); }
                else { selectedQuestions.add(q.id); gridBtns[q.id].classList.add("selected"); }
            });
            updateStartButton();
        }
        function updateStartButton() {
            const startBtn = document.getElementById("batch-start-btn");
            const selectAllBtn = document.getElementById("select-all-btn");
            selectAllBtn.textContent = (selectedQuestions.size === questionBank.length) ? "取消全選" : "全選";
            if (selectedQuestions.size > 0) {
                startBtn.classList.remove("hidden");
                document.getElementById("img-status").textContent = "已選 " + selectedQuestions.size + " 題";
            } else {
                startBtn.classList.add("hidden");
                document.getElementById("img-status").textContent = "";
            }
        }
        function startBatchPractice() {
            if (selectedQuestions.size === 0) return;
            batchQueue = Array.from(selectedQuestions).sort(function(a, b) { return a - b; });
            resetWrongRecords();
            document.getElementById("batch-progress").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadQuestion(batchQueue[0]);
        }
        function retryCurrentWrongQuestions() {
            if (lastRoundWrongSet.size === 0) return;
            batchQueue = Array.from(lastRoundWrongSet).sort(function(a, b) { return a - b; });
            resetWrongRecords();
            document.getElementById("batch-progress").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: "smooth" });
            loadQuestion(batchQueue[0]);
        }
        function resetWrongRecords() {
            lastRoundWrongSet.clear();
            wrongStats = {};
            isPracticeFinished = false;
            updateStatsTable();
        }
        function loadQuestion(qId) {
            currentQuestion = questionBank[qId - 1];
            document.getElementById("batch-progress").textContent = "剩 " + batchQueue.length + " 題";
            document.getElementById("quiz-title").textContent = qName(currentQuestion);
            document.getElementById("quiz-content").innerHTML = currentQuestion.html || esc(currentQuestion.text);
            document.getElementById("feedback").textContent = "";
            document.getElementById("feedback").className = "mt-4 text-center text-xl md:text-2xl font-bold h-10";
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";
            let options = [];
            if (currentQuestion.type === "tf") {
                options = [{ v: "O", t: "○" }, { v: "X", t: "╳" }];
            } else {
                for (let i = 1; i <= currentQuestion.n; i++) {
                    options.push({ v: String(i), t: currentQuestion.ls === "A" ? String.fromCharCode(64 + i) : CIRC[i - 1] });
                }
            }
            options.forEach(function(opt) {
                const btn = document.createElement("button");
                btn.textContent = opt.t;
                btn.className = "btn-option bg-yellow-100 hover:bg-yellow-300 text-yellow-900 text-2xl md:text-3xl font-bold py-4 md:py-6 rounded-xl border-2 border-yellow-400 active:bg-yellow-400 shadow-sm";
                btn.onclick = function() { checkAnswer(opt.v); };
                optionsContainer.appendChild(btn);
            });
            document.getElementById("section-menu").classList.add("hidden-section");
            document.getElementById("section-quiz").classList.remove("hidden-section");
        }
        function checkAnswer(selectedVal) {

            } else {
                feedbackBox.textContent = "❌ 答錯囉，再試一次！";
                feedbackBox.className = "mt-4 text-center text-xl md:text-2xl font-bold h-10 text-red-500 animate-pulse";
                lastRoundWrongSet.add(currentQuestion.id);
                wrongStats[currentQuestion.id] = (wrongStats[currentQuestion.id] || 0) + 1;
                updateStatsTable();
            }
        }
        function finishPracticeRound() {
            isPracticeFinished = true;
            backToMenu();
            updateStatsTable();
            if (lastRoundWrongSet.size === 0) {
                const randomMsg = encouragementList[Math.floor(Math.random() * encouragementList.length)];
                alert("💯 恭喜獲得 100 分！\n\n" + randomMsg);
            } else {
                alert("👍 本輪練習結束！下方已為你整理出錯題列表，點擊【重做下方錯題】按鈕即可再次挑戰！");
            }
            selectedQuestions.clear();
            generateGrid();
            document.getElementById("batch-start-btn").classList.add("hidden");
            document.getElementById("img-status").textContent = "";
            updateStartButton();
        }
        function backToMenu() {
            document.getElementById("section-quiz").classList.add("hidden-section");
            document.getElementById("section-menu").classList.remove("hidden-section");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        function updateStatsTable() {
            const tbody = document.getElementById("stats-body");
            const retryBtn = document.getElementById("retry-wrong-btn");
            const wrongCountTag = document.getElementById("wrong-count-tag");
            tbody.innerHTML = "";
            let ids = Object.keys(wrongStats);
            if (ids.length > 0) {
                if (isPracticeFinished) { retryBtn.classList.remove("hidden"); wrongCountTag.textContent = ids.length; } else { retryBtn.classList.add("hidden"); }
                ids.forEach(function(id) {
                    const q = questionBank[id - 1];
                    const qText = esc((q.text || "").substring(0, 15)) + (q.hasImg ? " 🖼" : "") + "...";
                    const tr = document.createElement("tr");
                    tr.className = "border-b bg-red-50";
                    tr.innerHTML = '<td class="py-2 px-3 font-bold text-gray-700 text-center">' + esc((q.sec ? q.sec + " " : "") + q.label) + '</td>' +
                                   '<td class="py-2 px-3 text-gray-800">' + qText + '</td>' +
                                   '<td class="py-2 px-3 text-center font-bold text-red-600">' + wrongStats[id] + '</td>';
                    tbody.appendChild(tr);
                });
            } else {
                retryBtn.classList.add("hidden");
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-gray-500">目前沒有錯題記錄</td></tr>';
            }
        }
    </script>
</body>
</html>
