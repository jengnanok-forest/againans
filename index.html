<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師端 - 產生錯題重答系統 (升級版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
</head>
<body class="bg-blue-50 font-sans min-h-screen p-6 flex items-center justify-center">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">👨‍🏫 教師端：建立錯題任務</h1>
        <p class="text-center text-gray-500 mb-8">支援「直接貼上截圖」與「智慧題號面板」的全新版本</p>

        <div class="border-2 border-dashed border-blue-300 rounded-lg p-6 bg-blue-50 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-bold mb-2 text-blue-800">1. 上傳「題目卷」(.docx)：</label>
                    <input type="file" id="qFile" accept=".docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200"/>
                </div>
                <div>
                    <label class="block font-bold mb-2 text-blue-800">2. 上傳「解析卷」(.docx)：</label>
                    <input type="file" id="aFile" accept=".docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200"/>
                </div>
            </div>
            <button onclick="generateStudentFile()" class="mt-8 w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 text-lg shadow-md transition-transform hover:scale-105">
                ⚡ 產生學生專屬練習網頁
            </button>
            <p id="status-msg" class="mt-4 text-center font-bold text-lg h-6"></p>
        </div>
    </div>

    <script>
        async function readDocxText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    mammoth.extractRawText({arrayBuffer: event.target.result})
                        .then(result => resolve(result.value))
                        .catch(reject);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        async function generateStudentFile() {
            const qFile = document.getElementById('qFile').files[0];
            const aFile = document.getElementById('aFile').files[0];
            const status = document.getElementById('status-msg');

            if (!qFile || !aFile) {
                status.textContent = "❌ 請確認「題目卷」與「解析卷」都已上傳！";
                status.className = "mt-4 text-center font-bold text-lg h-6 text-red-500";
                return;
            }

            status.textContent = "⏳ 檔案解析與網頁生成中，請稍候...";
            status.className = "mt-4 text-center font-bold text-lg h-6 text-blue-600";

            try {
                const qText = await readDocxText(qFile);
                const aText = await readDocxText(aFile);
                
                const qLines = qText.split('\n').map(l => l.trim()).filter(l => l !== '' && !l.includes('學年度') && !l.includes('一、選擇題') && !l.includes('二、是非題'));
                const aLines = aText.split('\n').map(l => l.trim()).filter(l => l.startsWith('答案：'));

                if (aLines.length === 0 || qLines.length === 0) {
                    status.textContent = "❌ 解析失敗，找不到符合格式的題目或答案。";
                    status.className = "mt-4 text-center font-bold text-lg h-6 text-red-500";
                    return;
                }

                let questionBank = [];
                const totalCount = Math.min(qLines.length, aLines.length);
                for(let i = 0; i < totalCount; i++) {
                    let ansStr = aLines[i].replace('答案：', '').trim();
                    questionBank.push({ id: i + 1, text: qLines[i], answer: ansStr });
                }

                const studentHtmlContent = getStudentTemplate(JSON.stringify(questionBank));

                const blob = new Blob([studentHtmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const fileName = `st-${Math.floor(Date.now() / 1000)}.html`;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                status.textContent = `✅ 成功生成並下載：${fileName} (共 ${totalCount} 題)`;
                status.className = "mt-4 text-center font-bold text-lg h-6 text-green-600";

            } catch (error) {
                console.error(error);
                status.textContent = "❌ 檔案解析發生錯誤，請確認檔案格式是否正確。";
                status.className = "mt-4 text-center font-bold text-lg h-6 text-red-500";
            }
        }

        // 學生端 HTML 模板
        function getStudentTemplate(questionBankJson) {
            return `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生端 - 錯題重答系統</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"><\/script>
    <style>
        .hidden-section { display: none; }
        .btn-option { transition: all 0.2s; }
        .btn-option:hover { transform: scale(1.05); }
        .q-btn { transition: all 0.1s; }
        .q-btn.selected { background-color: #ef4444; color: white; border-color: #dc2626; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.5); transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-center text-green-600 mb-8">🎓 錯題重答練習系統</h1>
        
        <div id="section-menu" class="mb-8">
            <p id="total-questions-info" class="mb-6 text-lg font-bold text-gray-700 text-center bg-gray-50 py-2 rounded">
                📚 題庫已載入，共 <span id="q-count" class="text-blue-600"></span> 題。
            </p>
            
            <!-- 智慧截圖辨識區 (已升級貼上功能) -->
            <div class="bg-purple-50 border-2 border-purple-300 rounded-lg p-6 mb-8 shadow-sm">
                <h2 class="text-2xl font-bold mb-2 text-purple-800 flex items-center">
                    <span>📸 直接貼上答題結果截圖</span>
                </h2>
                <p class="text-purple-600 mb-4 font-semibold">請在下方框內按下 <kbd class="bg-white border rounded px-1 shadow-sm">Ctrl</kbd> + <kbd class="bg-white border rounded px-1 shadow-sm">V</kbd> 貼上截圖，或手動點選要重答的題號。</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 貼上區與圖片預覽 -->
                    <div id="paste-area" class="border-2 border-dashed border-purple-400 bg-white rounded-xl h-64 flex flex-col items-center justify-center text-purple-400 cursor-pointer overflow-hidden relative transition-colors hover:bg-purple-100 focus:outline-none focus:ring-4 focus:ring-purple-300" tabindex="0">
                        <span id="paste-hint" class="font-bold text-lg pointer-events-none">點擊此處並按下 Ctrl+V 貼上圖片</span>
                        <img id="preview-img" class="hidden absolute inset-0 w-full h-full object-contain bg-black/5" />
                    </div>

                    <!-- 智慧題號面板 -->
                    <div class="flex flex-col">
                        <div class="flex justify-between items-end mb-2">
                            <h3 class="font-bold text-gray-700">📌 請確認錯題 (可手動點選修改)</h3>
                            <span id="img-status" class="text-sm font-bold text-purple-600"></span>
                        </div>
                        <div id="q-grid" class="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 gap-2 bg-white p-4 rounded-xl border border-purple-200 h-48 overflow-y-auto shadow-inner">
                            <!-- 題號按鈕會由 JS 動態產生 -->
                        </div>
                        <button id="batch-start-btn" onclick="startBatchPractice()" class="mt-4 w-full bg-purple-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-purple-700 shadow animate-pulse hidden">
                            🚀 確認無誤，開始錯題重答
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 答題區 -->
        <div id="section-quiz" class="hidden-section bg-yellow-50 border-2 border-yellow-300 rounded-lg p-6 mb-8 relative">
            <div class="flex justify-between items-center mb-4">
                <button onclick="backToMenu()" class="text-gray-500 hover:text-gray-800 font-bold px-4 py-2 border rounded bg-white shadow-sm">← 返回主選單</button>
                <span id="batch-progress" class="font-bold text-white bg-purple-600 px-4 py-1 rounded-full shadow"></span>
            </div>
            <h2 class="text-2xl font-bold mb-4 text-yellow-800" id="quiz-title">第 X 題</h2>
            <div id="quiz-content" class="text-xl bg-white p-6 rounded-lg shadow mb-6 leading-relaxed"></div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="options-container"></div>
            <div id="feedback" class="mt-6 text-center text-2xl font-bold h-10"></div>
        </div>

        <!-- 統計區 -->
        <div id="section-stats">
            <h2 class="text-xl font-bold mb-4 text-gray-800">📊 錯題答題次數統計</h2>
            <div class="bg-white rounded-lg shadow overflow-hidden border border-gray-200">
                <table class="min-w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 px-4 text-left font-bold w-24">題號</th>
                            <th class="py-3 px-4 text-left font-bold">題目預覽</th>
                            <th class="py-3 px-4 text-center font-bold w-32">錯誤次數</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body">
                        <tr><td colspan="3" class="py-4 text-center text-gray-500">目前還沒有錯題記錄</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const questionBank = ${questionBankJson};
        const wrongStats = {}; 
        let currentQuestion = null;
        let batchQueue = [];
        let selectedQuestions = new Set(); // 記錄面板上選中的題號

        // 系統初始化
        window.onload = () => {
            document.getElementById('q-count').textContent = questionBank.length;
            questionBank.forEach(q => wrongStats[q.id] = 0);
            generateGrid();
            
            // 綁定貼上事件 (Ctrl+V)
            document.getElementById('paste-area').addEventListener('paste', handlePaste);
            document.addEventListener('paste', handlePaste); // 備用全域綁定
        };

        // 產生智慧題號面板
        function generateGrid() {
            const grid = document.getElementById('q-grid');
            grid.innerHTML = "";
            for(let i = 1; i <= questionBank.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = "q-btn bg-gray-100 text-gray-700 font-bold py-2 rounded-lg border border-gray-300 hover:bg-gray-200 focus:outline-none";
                btn.onclick = () => toggleQuestion(i, btn);
                grid.appendChild(btn);
            }
        }

        // 手動點選切換錯題
        function toggleQuestion(num, btnElement) {
            if (selectedQuestions.has(num)) {
                selectedQuestions.delete(num);
                btnElement.classList.remove('selected');
            } else {
                selectedQuestions.add(num);
                btnElement.classList.add('selected');
            }
            
            const startBtn = document.getElementById('batch-start-btn');
            if (selectedQuestions.size > 0) {
                startBtn.classList.remove('hidden');
                document.getElementById('img-status').textContent = \`已選 \${selectedQuestions.size} 題\`;
            } else {
                startBtn.classList.add('hidden');
                document.getElementById('img-status').textContent = "";
            }
        }

        // 處理剪貼簿圖片
        function handlePaste(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.includes('image/')) {
                    e.preventDefault(); // 阻擋預設貼上行為
                    const blob = item.getAsFile();
                    processImageBlob(blob);
                    return;
                }
            }
        }

        // 圖片預覽與 AI 辨識流程
        async function processImageBlob(blob) {
            const imgUrl = URL.createObjectURL(blob);
            const previewImg = document.getElementById('preview-img');
            const hint = document.getElementById('paste-hint');
            const status = document.getElementById('img-status');
            
            previewImg.src = imgUrl;
            previewImg.classList.remove('hidden');
            hint.classList.add('hidden');
            status.textContent = "⏳ AI 掃描辨識中...";

            const img = new Image();
            img.src = imgUrl;
            await new Promise(r => img.onload = r);

            // 針對「紅圈白字」進行圖像前處理增強
            const canvas = document.createElement('canvas');
            canvas.width = img.width * 2; 
            canvas.height = img.height * 2;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // 嘗試進行 OCR
            try {
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({ tessedit_char_whitelist: '0123456789' });
                const ret = await worker.recognize(canvas);
                await worker.terminate();

                const detectedNums = [];
                ret.data.words.forEach(word => {
                    const num = parseInt(word.text.replace(/[^0-9]/g, ''));
                    if (num > 0 && num <= questionBank.length) {
                        detectedNums.push(num);
                    }
                });

                // 自動點亮面板上有抓到的數字
                if (detectedNums.length > 0) {
                    status.textContent = "✅ 掃描完成！請確認是否漏選";
                    detectedNums.forEach(num => {
                        if(!selectedQuestions.has(num)) {
                            const btns = document.getElementById('q-grid').children;
                            toggleQuestion(num, btns[num-1]);
                        }
                    });
                } else {
                    status.textContent = "⚠️ 找不到清晰錯題，請直接點擊下方題號";
                }
            } catch (e) {
                console.error(e);
                status.textContent = "⚠️ 辨識遇到干擾，請直接手動點擊錯題";
            }
        }

        // --- 測驗流程 ---
        function startBatchPractice() {
            if(selectedQuestions.size === 0) return;
            batchQueue = Array.from(selectedQuestions).sort((a, b) => a - b);
            document.getElementById('batch-progress').classList.remove('hidden');
            loadQuestion(batchQueue[0]);
        }

        function loadQuestion(qId) {
            currentQuestion = questionBank[qId - 1];
            document.getElementById('batch-progress').textContent = \`剩餘 \${batchQueue.length} 題\`;
            document.getElementById('quiz-title').textContent = \`第 \${currentQuestion.id} 題 重做\`;
            document.getElementById('quiz-content').textContent = currentQuestion.text;
            document.getElementById('feedback').textContent = "";
            document.getElementById('feedback').className = "mt-6 text-center text-2xl font-bold h-10";

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = "";
            let options = (currentQuestion.answer === '○' || currentQuestion.answer === '╳' || currentQuestion.text.includes('是非題')) ? ['○', '╳'] : ['①', '②', '③', '④'];

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.className = "btn-option bg-yellow-100 hover:bg-yellow-300 text-yellow-900 text-3xl font-bold py-6 rounded-xl border-2 border-yellow-400";
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('section-menu').classList.add('hidden-section');
            document.getElementById('section-quiz').classList.remove('hidden-section');
        }

        function checkAnswer(selectedOpt) {
            const feedbackBox = document.getElementById('feedback');
            if (selectedOpt === currentQuestion.answer) {
                feedbackBox.textContent = "🎉 答對了！太棒了！";
                feedbackBox.className = "mt-6 text-center text-2xl font-bold h-10 text-green-600";
                setTimeout(() => {
                    batchQueue.shift(); // 答對移除
                    if (batchQueue.length > 0) {
                        loadQuestion(batchQueue[0]);
                    } else { 
                        alert("🏆 恭喜！所有錯題都已經完全訂正完畢！"); 
                        // 清空選項與圖片
                        selectedQuestions.clear();
                        generateGrid();
                        document.getElementById('preview-img').classList.add('hidden');
                        document.getElementById('paste-hint').classList.remove('hidden');
                        document.getElementById('batch-start-btn').classList.add('hidden');
                        document.getElementById('img-status').textContent = "";
                        backToMenu(); 
                    }
                }, 1200);
            } else {
                feedbackBox.textContent = "❌ 答錯囉，必須再試一次喔！";
                feedbackBox.className = "mt-6 text-center text-2xl font-bold h-10 text-red-500 animate-pulse";
                wrongStats[currentQuestion.id] += 1;
                updateStatsTable();
            }
        }

        function backToMenu() {
            document.getElementById('section-quiz').classList.add('hidden-section');
            document.getElementById('section-menu').classList.remove('hidden-section');
        }

        function updateStatsTable() {
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = "";
            let hasWrongRecord = false;
            Object.keys(wrongStats).forEach(id => {
                if (wrongStats[id] > 0) {
                    hasWrongRecord = true;
                    const qText = questionBank[id-1].text.substring(0, 22) + "...";
                    const tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-gray-50";
                    tr.innerHTML = \`<td class="py-3 px-4 font-bold text-gray-700">第 \${id} 題</td>
                                    <td class="py-3 px-4 text-gray-600">\${qText}</td>
                                    <td class="py-3 px-4 text-center font-bold text-red-500">\${wrongStats[id]} 次</td>\`;
                    tbody.appendChild(tr);
                }
            });
            if (!hasWrongRecord) tbody.innerHTML = \`<tr><td colspan="3" class="py-4 text-center text-gray-500">目前還沒有錯題記錄</td></tr>\`;
        }
    <\/script>
</body>
</html>`;
        }
    </script>
</body>
</html>
